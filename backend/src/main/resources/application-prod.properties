# Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
# MongoDB Configuration
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.uri=mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_CLUSTER}
# Security Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION}
# Email Configuration
spring.sendgrid.api-key=${EMAIL_API_KEY}
# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.bookit=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# Performance Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# AWS S3 Configuration
aws.s3.bucket=${env.AWS_S3_BUCKET_NAME}
aws.accessKey=${env.AWS_ACCESS_KEY_ID}
aws.secretKey=${env.AWS_SECRET_ACCESS_KEY}
aws.region=${env.AWS_REGION}
